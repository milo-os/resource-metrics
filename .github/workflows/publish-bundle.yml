name: publish-bundle

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.14.0
    with:
      image-name: resource-metrics
      registry-organization: milo-os
      # Publish a multi-arch image so the controller runs on arm64 nodes
      # (e.g. Apple-silicon kind clusters used by the dns-operator e2e), not
      # just amd64. The shared workflow builds with buildx per this list.
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-kustomize-bundles:
    needs: build-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.14.0
    with:
      bundle-name: ghcr.io/milo-os/resource-metrics-kustomize
      bundle-path: config
      image-overlays: config/manager
      image-name: ghcr.io/milo-os/resource-metrics
    secrets: inherit
